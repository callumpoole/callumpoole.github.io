<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Switch</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
      :root { --colorB: #1d1d1d; }
      body { background-color: var(--colorB); color: #fff; font-family: 'Montserrat', sans-serif; }
      .webgl-content .footer { color: #fff; font-family: 'Montserrat', sans-serif; }
    </style>
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/WebGL - Release 4.json", {onProgress: UnityProgress});
    </script>
  </head>
  <body>
    <div stlye="position: fixed; left: 0; top: 0">
        R - Restart
	<br/>
	W, A, S and D - Move Black Player

	<br/>
	Up, Left, Down and Right - Move White Player

    </div>
    <div class="webgl-content">
      <div id="gameContainer" style="width: 1280px; height: 720px"></div>
      <div class="footer">
        <div class="webgl-logo"></div>
        <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
        <div class="title">Switch</div>
      </div>
    </div>
  </body>
</html>
