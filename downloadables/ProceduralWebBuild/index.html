<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | ProcedurallyGeneratedVillageWeb</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/ProceduralWebBuild.json", {onProgress: UnityProgress});
    </script>
  </head>
  <body>
    <div style="position:fixed;">
	WARNING OLD PROJECT, NOT OPTIMISED - LOW FPS ON OLDER HARDWARE
	<br/>
	<br/>
	W, A, S and D - Move
	<br/>
	Q and E - Rotate Camera
	<br/>
	Shift - Faster Movement
	<br/>
	Scroll - Zoom
	<br/>
	F5 - Generate New
	</div>
    <div class="webgl-content">
      <div id="gameContainer" style="width: 960px; height: 600px"></div>
      <div class="footer">
        <div class="webgl-logo"></div>
        <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
        <div class="title">ProcedurallyGeneratedVillageWeb</div>
      </div>
    </div>
  </body>
</html>
