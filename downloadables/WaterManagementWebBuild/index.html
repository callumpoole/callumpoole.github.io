<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Water Management Game Remake Fix</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
      :root { --colorB: #1d1d1d; }
      body { background-color: var(--colorB); color: #fff; font-family: 'Montserrat', sans-serif; }
      .webgl-content .footer { color: #fff; font-family: 'Montserrat', sans-serif; }
    </style>
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/WaterGameWeb.json", {onProgress: UnityProgress});
    </script>
  </head>
  <body>
    <div style="position:fixed">
    W, A, S and D - Move<br/>
    Q and E - Rotate Camera<br/>
    Scroll +/- - Zoom<br/>
    LMB - Build / Select<br/>
    RMB - Cancel / Deselect<br/>
    T - Toggle Terrain<br/>
    B - Toggle Build Mode<br/>
    R - Toggle Remove Mode<br/>
    O - Toggle Objectives<br/>
    1-8 - Select Build Item<br/>
    Space - Rotate Pipe<br/>
    &lt; and &gt; - Time Scale<br/>
    </div>
    <div class="webgl-content">
      <div id="gameContainer" style="width: 960px; height: 600px"></div>
      <div class="footer">
        <div class="webgl-logo"></div>
        <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
        <div class="title">Water Management Game Remake Fix</div>
      </div>
    </div>
  </body>
</html>
